
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hover event // infiniware</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(227, 30, 36, 0.12), transparent 32%),
          #000;
      }

      .hover-art {
        width: min(92vw, 980px);
        padding: clamp(32px, 6vw, 72px);
        border: 1px solid rgba(227, 30, 36, 0.18);
        background: rgba(0, 0, 0, 0.82);
        box-shadow: 0 0 48px rgba(227, 30, 36, 0.08);
      }

      .hover-rule {
        height: 1px;
        background: rgba(227, 30, 36, 0.22);
        margin: 0 0 56px;
      }

      .hover-lockup {
        display: grid;
        justify-items: center;
      }

      .hover-logo {
        font-family: 'Ubuntu', sans-serif;
        font-size: clamp(3rem, 8vw, 5.75rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        color: #fff7f2;
        line-height: 0.95;
        text-shadow:
          0 0 0 rgba(227, 30, 36, 0.7),
          0 0 18px rgba(227, 30, 36, 0.26),
          0 0 38px rgba(227, 30, 36, 0.12);
      }

      .hover-logo span {
        color: #e31e24;
        text-transform: uppercase;
      }

      .hover-event-word {
        margin-top: 18px;
        margin-left: clamp(80px, 16vw, 180px);
        font-family: 'Ubuntu', sans-serif;
        font-size: clamp(1.5rem, 4vw, 2.6rem);
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #fff7f2;
        text-shadow: 0 0 16px rgba(227, 30, 36, 0.22);
      }

      .hover-date {
        margin-top: 14px;
        margin-left: clamp(92px, 18vw, 196px);
        font-family: 'Ubuntu', sans-serif;
        font-size: clamp(0.78rem, 1.8vw, 1rem);
        letter-spacing: 0.22em;
        color: #dadada;
      }

      .hover-rule.bottom {
        margin: 56px 0 0;
      }

      @media (max-width: 600px) {
        .hover-event-word,
        .hover-date {
          margin-left: 0;
          justify-self: center;
        }
      }
    </style>
  </head>
  <body>
    <main class="hover-art" aria-label="infiniware event artwork">
      <div class="hover-rule"></div>
      <div class="hover-lockup">
        <div class="hover-logo"><span>I</span>nfiniware</div>
        <div class="hover-event-word">event</div>
        <div class="hover-date">coming 21 may 2026</div>
      </div>
      <div class="hover-rule bottom"></div>
    </main>
  </body>
</html>
